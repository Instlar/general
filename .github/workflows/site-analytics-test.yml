name: Test shared sites analytics admin
on:
  push:
    branches: [healthy-baking-v1]
    paths:
      - "site-analytics/**"
      - ".github/workflows/site-analytics-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check syntax
        working-directory: site-analytics
        run: |
          node --check server.mjs
          node --check public/admin.js
          node --check public/tracker.js
      - name: Run auth, analytics and security tests
        working-directory: site-analytics
        run: npm test
      - name: Package tested admin for deployment
        if: matrix.node == '24'
        run: |
          zip -q -r "$RUNNER_TEMP/site-analytics-deploy.zip" site-analytics/ \
            -x "site-analytics/data/*" "site-analytics/.env" "site-analytics/node_modules/*"
      - uses: actions/upload-artifact@v4
        if: matrix.node == '24'
        with:
          name: ready-site-analytics-admin
          path: ${{ runner.temp }}/site-analytics-deploy.zip
          if-no-files-found: error
          retention-days: 30
